<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uteki · 页面与交互设计稿</title>
  <link rel="stylesheet" href="blueprint.css">
</head>
<body>
  <a class="skip" href="#content">跳到设计内容</a>
  <header class="document-header">
    <a href="#map" class="wordmark">uteki<span>INTERFACE BLUEPRINT</span></a>
    <div class="edition">页面与交互设计稿 <span>v0.1 · 2026.09.30</span></div>
    <a class="status-pill" href="../company-workspace-v2/">打开统一工作台样板 ↗</a>
  </header>
  <div class="document-layout">
    <nav class="document-nav" aria-label="设计文档目录">
      <p class="eyebrow">阅读顺序 / CONTENTS</p>
      <div id="page-nav"></div>
      <div class="nav-foot"><b>怎么使用</b><p>点击页面名看线框。蓝色编号对应区域说明；线框中的按钮可演示主要跳转。</p><p>示意内容不代表真实研究、持仓或收益。页面布局与交互细节均待讨论。</p></div>
    </nav>
    <main id="content" tabindex="-1">
      <div class="page-intro"><div><p id="page-code" class="eyebrow"></p><h1 id="page-title"></h1><p id="page-question" class="page-question"></p></div><button id="back" class="quiet" hidden>← 返回上一张线框</button></div>
      <div id="page-summary"></div>
      <div id="screen-tools" class="screen-tools" hidden>
        <span>内容状态 / STATE</span>
        <label class="sr-only" for="state-select">切换示意状态</label>
        <select id="state-select"><option value="ready">示意内容</option><option value="loading">加载中</option><option value="empty">尚无数据</option><option value="stale">待复核 / 更新滞后</option><option value="error">读取失败</option></select>
        <span class="tool-hint">蓝色编号为设计标注，不出现在正式产品中</span>
      </div>
      <div id="design-body"></div>
      <div id="page-contract"></div>
      <footer class="document-footer">本稿定义页面职责、展示内容与交互建议。已有业务规则沿用；不表示后台已接通。点击只演示导航，不执行研究、获取数据或交易。</footer>
    </main>
  </div>
  <noscript>请启用 JavaScript 查看可切换的页面线框。此文档不访问网络服务。</noscript>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
