<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard interaction lab</title>
<style>
:root{--bg:#f3f4f0;--ink:#202c29;--muted:#74817a;--line:#e2e7df;--green:#286b50;--lime:#d6f19a;--orange:#dc7953}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,sans-serif}button,select{font:inherit;cursor:pointer}button{color:inherit}header{padding:24px 36px;background:var(--bg);border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green);text-transform:uppercase}h1{font-size:28px;font-weight:550;margin:8px 0}p{color:var(--muted);line-height:1.7}nav{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}nav button,.btn{background:white;border:1px solid var(--line);padding:9px 13px;border-radius:9px}nav button.active{background:var(--ink);color:white;border-color:var(--ink)}.shell{max-width:1440px;margin:auto;padding:24px 36px}.toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#f3f4f0ed;backdrop-filter:blur(16px);padding:14px 0;border-bottom:1px solid var(--line)}.toolbar strong{margin-right:auto}.toolbar select{border:1px solid var(--line);padding:8px;border-radius:7px;background:white}.hint{min-height:38px;margin:14px 0;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0;position:relative;transition:opacity .2s,box-shadow .2s}.card h3{font-size:14px;margin:0 0 6px;font-weight:550}.sub{font-size:11px;color:var(--muted)}.big{font-size:34px;letter-spacing:-1.5px;margin:18px 0 3px;font-variant-numeric:tabular-nums}.delta{color:var(--green);font-size:12px}.kpi{grid-column:span 3}.hero{grid-column:span 8;grid-row:span 2}.side{grid-column:span 4}.full{grid-column:span 12}.half{grid-column:span 6}.chart{height:220px;position:relative;margin-top:24px}.bars{height:100%;display:flex;gap:8px;align-items:flex-end}.bar{flex:1;background:var(--green);border-radius:4px 4px 0 0;min-width:0;height:var(--h);transition:height .45s,opacity .2s;background-color:var(--green);border:0;padding:0}.bar:nth-child(3n){background-color:#88ad88}.bars.hovering .bar{opacity:.22}.bars.hovering .bar.hot{opacity:1}.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:10px}.ref{position:absolute;top:0;bottom:0;width:1px;background:var(--orange);pointer-events:none;display:none}.legend{display:flex;gap:16px;margin-top:20px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}.card-top{display:flex;justify-content:space-between;align-items:center}.iconbtn{border:0;background:#f3f4f0;border-radius:6px;padding:5px 9px}.list{width:100%;border-collapse:collapse;margin-top:16px;table-layout:fixed}.list th{text-align:left;font-size:11px;color:var(--muted);font-weight:400}.list td,.list th{padding:14px 8px;border-bottom:1px solid var(--line)}.list td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list tbody tr{cursor:pointer}.list tr.selected{background:#edf4e9}.pill{font-size:10px;border-radius:20px;background:#edf4e9;padding:4px 8px;color:var(--green)}.master{display:flex;gap:16px;align-items:flex-start}.master>.card{flex:1}.drawer{width:0;opacity:0;overflow:hidden;position:sticky;top:90px;transition:width .25s,opacity .25s}.drawer.open{width:320px;opacity:1;flex-shrink:0}.drawer .card{min-width:280px}.drawer h2{font-size:23px}.detail-line{padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.band{margin-bottom:48px}.sticky-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:20px;align-items:start}.sticky-side{position:sticky;top:90px}.event{padding:18px 0;border-bottom:1px solid var(--line)}.event small{display:block;color:var(--muted);margin-bottom:7px}.canvas{height:660px;background:#e4ebe0;border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden}.canvas svg{width:100%;height:100%}.floating{position:absolute;width:245px;background:#ffffffed;box-shadow:0 10px 35px #26352910;backdrop-filter:blur(10px)}.tl{top:20px;left:20px}.tr{top:20px;right:20px}.bl{bottom:20px;left:20px}.br{bottom:20px;right:20px}.kanban{display:flex;gap:16px;overflow-x:auto;padding-bottom:20px}.column{width:216px;flex:0 0 216px;background:#e9ece5;border-radius:12px;padding:12px;min-height:500px}.column h3{font-size:12px;display:flex;justify-content:space-between;margin:8px 4px 18px}.task{background:white;padding:17px;border:1px solid var(--line);border-radius:11px;margin-bottom:12px;cursor:grab}.task p{font-size:12px}.task small{color:var(--muted)}.timeline{overflow-x:auto}.timeline-inner{min-width:860px}.timehead,.lane{display:grid;grid-template-columns:130px 1fr}.hours{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;padding-bottom:18px}.lane{border-top:1px solid var(--line);height:92px;align-items:center}.track{height:100%;position:relative;background:repeating-linear-gradient(to right,transparent 0,transparent calc(10% - 1px),var(--line) calc(10% - 1px),var(--line) 10%)}.timebar{position:absolute;top:25px;height:40px;background:var(--lime);border:0;border-radius:7px;padding:10px 12px;font-size:11px;overflow:hidden;white-space:nowrap}.now{position:absolute;top:0;bottom:0;left:43%;width:1px;background:var(--orange);pointer-events:none}.now:before{content:'12:18 · 演示时刻';position:absolute;top:0;font-size:9px;color:var(--orange);white-space:nowrap}.bento>.card{cursor:default}.handle{cursor:grab;touch-action:none}.dragging{opacity:.4}.drop-over{box-shadow:0 0 0 2px var(--green)}.focus-main{min-height:450px}.thumbs{display:flex;gap:10px;overflow:auto;margin-top:16px}.thumbs button{min-width:150px;background:white;border:1px solid var(--line);padding:15px;text-align:left;border-radius:10px}.thumbs button.active{border-color:var(--green);background:#edf4e9}.compact-metrics{display:none;gap:20px;font-size:12px}.compact-metrics b{font-variant-numeric:tabular-nums}.collapsed .compact-metrics{display:flex}.collapse-area{overflow:hidden;max-height:160px;opacity:1;transition:none}.foot{padding:28px 0;color:var(--muted);font-size:11px}.empty{padding:35px;color:var(--muted)}@media(max-width:900px){header,.shell{padding:20px}.hero,.side,.half{grid-column:span 12}.kpi{grid-column:span 6}.sticky-layout{grid-template-columns:1fr}.sticky-side{position:static}.drawer.open{width:260px}.floating{width:190px;padding:14px}.canvas{height:720px}.big{font-size:29px}.compact-metrics{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important;scroll-behavior:auto!important}}
</style>
<header><div class="eyebrow">Form & interaction / 01</div><h1>Dashboard 交互实验室</h1><p>六种布局，六种交互。统一使用虚构的运营数据，比较每种结构怎样帮助阅读和操作。</p><nav id="nav"></nav></header>
<div class="shell"><div class="toolbar" id="toolbar"><strong id="heading"></strong><div class="compact-metrics" id="compact"></div><label>范围 <select id="range"><option value="1">最近 12 天</option><option value=".78">前 12 天</option><option value="1.2">同期对照</option></select></label><label>分类 <select id="category"><option value="1">全部业务</option><option value=".62">线上业务</option><option value=".38">线下业务</option></select></label><button class="btn" id="reset">重置布局</button></div><p class="hint" id="hint"></p><main id="main"></main><div class="foot">DEMO ONLY · 全部数据、地理坐标、事项与记录均为模拟。筛选系数用于演示联动，动画中间值不代表真实观测。</div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const modes=[['hero','主次布局'],['bands','横带分层'],['sticky','主区 + 窄栏'],['canvas','全幅画布'],['kanban','看板分列'],['timeline','时间轴泳道'],['bento','拖拽网格'],['focus','就地放大'],['collapse','滚动吸顶'],['drawer','列表 + 详情']];
const tips={hero:'核心趋势占 8 列，右侧占 4 列。悬停任意柱子，两张图同步高亮；顶部筛选同时更新指标与图表。',bands:'概览 → 趋势 → 明细，横带间距 48px。点击明细行查看右侧详情。',sticky:'滚动页面，右侧提醒保持可见；左侧连续阅读图表和列表。',canvas:'画布承担空间关系，四角面板提供摘要。点击地图节点切换选中区域。',kanban:'五列各宽 216px，可横向滚动。拖动卡片改变状态；卡片菜单支持键盘操作。',timeline:'五条泳道，08:00–18:00。点击事项查看时间信息；橙色线是固定演示时刻。',bento:'按住模块标题旁的 ⠿ 拖动到另一模块，松手重排并保存到当前浏览器。标题箭头提供键盘替代操作。',focus:'点击模块右上角 ↗ 原位进入详情，其他模块变为底部切换条；返回恢复概览。',collapse:'向下滚动，指标按滚动进度收缩；顶栏显示同一组数字，反向滚动连续展开。',drawer:'点击表格行，右侧详情展开，列表保持可见。聚焦表格后用 ↑ / ↓ 切换记录，Escape 关闭。'};
let mode='hero',hover=-1,selected=-1,focusId=null,dragId=null,anim=null;
let order=['trend','revenue','orders','channels','visits'];try{const o=JSON.parse(localStorage.getItem('dashboard-demo-order'));if(Array.isArray(o)&&o.length===5&&new Set(o).size===5&&o.every(x=>order.includes(x)))order=o}catch(e){}
const raw=[32,41,36,57,48,62,53,74,66,83,72,94];const records=[['华东旗舰店','直营',82400, .14],['西岸线上店','线上',63800,.09],['北城体验店','直营',51700,.12],['南区合作店','合作',43600,-.03],['中央线上店','线上',39500,.17],['滨河体验店','直营',32100,.06],['山麓合作店','合作',28400,.08],['海湾旗舰店','直营',24700,.11]];
let tasks=Array.from({length:10},(_,i)=>({id:i,name:['核对周度指标','整理渠道反馈','更新趋势预测','审阅季度方案','同步库存记录','检查异常订单','准备复盘材料','确认活动排期','归档验收结果','发布工作摘要'][i],state:i%5}));
function factor(){return Number($('#range').value)*Number($('#category').value)}
function fmt(n){return Math.round(n).toLocaleString('zh-CN')}
function kpi(title,n,prefix='',suffix='',cls='kpi',id=''){return `<section class="card ${cls}" ${id?`data-id="${id}"`:''}><div class="card-top"><h3>${title}</h3>${id?controls(id):''}</div><div class="sub">SIMULATED / 模拟数据</div><div class="big">${prefix}<span data-value="${n}">${fmt(n*factor())}</span>${suffix}</div><div class="delta">↗ 对照变化 +12.8% · 模拟</div></section>`}
function controls(id){return mode==='bento'?`<span><button class="iconbtn handle" draggable="true" aria-label="拖动模块" data-drag="${id}">⠿</button> <button class="iconbtn" data-move="${id}" aria-label="将模块前移">←</button></span>`:`<button class="iconbtn" data-focus="${id}" aria-label="放大模块">↗</button>`}
function chart(title='业务趋势',cls='hero',id='trend',alt=false){return `<section class="card ${cls}" data-id="${id}"><div class="card-top"><h3>${title}</h3>${controls(id)}</div><div class="sub">12 天 · ${alt?'访问指数':'每日交易指数'} · 模拟</div><div class="chart"><div class="bars">${raw.map((v,i)=>`<button class="bar" data-point="${i}" aria-label="第 ${i+1} 天，指数 ${v}" style="--h:${(alt?100-v*.5:v)*factor()/1.2}%"></button>`).join('')}</div><div class="ref"></div></div><div class="axis"><span>10.01</span><span>10.06</span><span>10.12</span></div><div class="legend"><span><i class="dot"></i>${alt?'访问量':'交易量'}</span><span class="hover-label">悬停比较同一日期</span></div></section>`}
function summary(){return `<div class="grid">${kpi('总交易额',428600,'¥')}${kpi('完成订单',2841)}${kpi('活跃客户',1934)}${kpi('每单金额',151,'¥')}</div>`}
function table(){return `<div class="master"><section class="card"><div class="card-top"><h3>渠道表现</h3><span class="sub">8 条模拟记录</span></div><table class="list" tabindex="0" aria-label="渠道记录，用上下方向键切换"><thead><tr><th>渠道名称</th><th>类型</th><th>交易额</th><th>变化</th></tr></thead><tbody>${records.map((r,i)=>`<tr tabindex="0" data-row="${i}" class="${i===selected?'selected':''}"><td>${r[0]}</td><td><span class="pill">${r[1]}</span></td><td>¥${fmt(r[2]*factor())}</td><td>${r[3]>0?'+':''}${(r[3]*100).toFixed(0)}%</td></tr>`).join('')}</tbody></table></section><aside class="drawer" id="drawer"></aside></div>`}
function reminders(){return `<section class="card sticky-side"><div class="eyebrow">Up next</div><h3 style="margin-top:12px">今日提醒</h3>${['10:30 · 指标复盘','13:00 · 渠道沟通','15:00 · 方案审阅','17:30 · 周报确认'].map((x,i)=>`<div class="event"><small>0${i+1} / 演示事项</small>${x}</div>`).join('')}<p>固定的是辅助信息。主区滚动继续阅读。</p></section>`}
function canvas(){return `<div class="canvas"><svg viewBox="0 0 1100 650" role="img" aria-label="虚构区域示意图"><defs><pattern id="mesh" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#cad6c5" stroke-width=".6"/></pattern></defs><rect width="1100" height="650" fill="url(#mesh)"/><path d="M240 0 Q670 260 390 650" fill="none" stroke="#c1d8d2" stroke-width="110"/><g fill="none" stroke="#fff" stroke-width="12"><path d="M0 220L1100 460M150 650L950 0M0 470L1100 150"/></g>${[[350,210],[700,190],[620,400],[390,490],[790,460]].map(([x,y],i)=>`<g tabindex="0" role="button" aria-label="选择区域 ${i+1}" data-region="${i}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${i===0?28:16}" fill="${i===0?'#286b50':'#88ad88'}" stroke="white" stroke-width="4"/><text x="${x+30}" y="${y+5}" fill="#286b50" font-size="13">区域 ${i+1}</text></g>`).join('')}</svg><section class="card floating tl"><div class="eyebrow">Region overview</div><h3 id="region-name" style="margin-top:9px">区域 1</h3><div class="big">¥<span data-value="82400">${fmt(82400*factor())}</span></div><div class="sub">选中区域交易额 / 模拟</div></section><section class="card floating tr"><h3>覆盖概览</h3><div class="detail-line">活跃区域 <b>5</b></div><div class="detail-line">节点状态 <b>模拟在线</b></div></section><section class="card floating bl"><h3>区域活动</h3><p>本示意图展示空间关系。坐标与事件均为虚构。</p><span class="pill">计划内 · 3 项</span></section><section class="card floating br"><h3>图例</h3><p>● 深绿：选中区域<br>● 浅绿：其他区域<br>浅蓝带：虚构河道</p></section></div>`}
function kanban(){const states=['待开始','调查中','执行中','待审阅','已完成'];return `<div class="kanban">${states.map((s,i)=>`<section class="column" data-state="${i}"><h3>${s}<span>${tasks.filter(t=>t.state===i).length}</span></h3>${tasks.filter(t=>t.state===i).map(t=>`<article class="task" draggable="true" data-task="${t.id}"><small>OPS-${String(t.id+1).padStart(3,'0')}</small><p style="color:var(--ink)">${t.name}</p><small>林 · 模拟任务</small><select data-task-state="${t.id}" aria-label="修改 ${t.name} 状态" style="width:100%;margin-top:12px;border:1px solid var(--line);padding:5px;border-radius:5px">${states.map((v,j)=>`<option value="${j}" ${j===t.state?'selected':''}>${v}</option>`).join('')}</select></article>`).join('')}</section>`).join('')}</div>`}
function timeline(){const names=['研究团队','数据团队','运营团队','产品团队','审核团队'];return `<section class="card timeline"><div class="timeline-inner"><div class="timehead"><b>工作泳道</b><div class="hours">${Array.from({length:11},(_,i)=>`<span>${String(i+8).padStart(2,'0')}:00</span>`).join('')}</div></div>${names.map((n,i)=>`<div class="lane"><b>${n}</b><div class="track"><button class="timebar" data-time="${i}" style="left:${i*6+3}%;width:23%;background:${['#d6f19a','#cce0d3','#eadcc8','#d8dfef','#d9e4d1'][i]}">${['资料梳理','数据核验','渠道回顾','方案讨论','结果审阅'][i]}</button><button class="timebar" data-time="${i+5}" style="left:${55+i*3}%;width:18%;background:#e6ebe2">阶段交付</button><div class="now"></div></div></div>`).join('')}<p id="time-detail" aria-live="polite">点击时间条查看事项的模拟起止时间。</p></div></section>`}
function module(id,cls){return id==='trend'?chart('交易趋势',cls,id):id==='visits'?chart('访问趋势',cls,id,true):kpi({revenue:'总交易额',orders:'完成订单',channels:'活跃渠道'}[id],{revenue:428600,orders:2841,channels:24}[id],id==='revenue'?'¥':'','',cls,id)}
function render(){hover=-1;$('#heading').textContent=modes.find(m=>m[0]===mode)[1];$('#hint').textContent=tips[mode];$('#nav').innerHTML=modes.map(([id,n],i)=>`<button data-mode="${id}" class="${id===mode?'active':''}">${String(i+1).padStart(2,'0')} ${n}</button>`).join('');let html='';
if(mode==='hero')html=`<div class="grid">${chart()}${kpi('总交易额',428600,'¥','','side')}${kpi('完成订单',2841,'','','side')}${chart('访问趋势','half','visits',true)}${kpi('活跃客户',1934,'','','kpi')}${kpi('每单金额',151,'¥','','kpi')}</div>`;
if(mode==='bands')html=`<div class="band">${summary()}</div><div class="grid band">${chart('交易趋势','half')}${chart('访问趋势','half','visits',true)}</div>${table()}`;
if(mode==='sticky')html=`<div class="sticky-layout"><div><div class="grid band">${kpi('总交易额',428600,'¥','','half')}${kpi('完成订单',2841,'','','half')}</div><div class="grid band">${chart('交易趋势','full')}${chart('访问趋势','full','visits',true)}</div>${table()}</div>${reminders()}</div>`;
if(mode==='canvas')html=canvas();if(mode==='kanban')html=kanban();if(mode==='timeline')html=timeline();
if(mode==='bento')html=`<div class="grid bento">${order.map((id,i)=>module(id,i===0?'hero':i===1||i===2?'side':'half')).join('')}</div>`;
if(mode==='focus')html=focusId?`<div class="card-top" style="margin-bottom:16px"><span class="sub">详情 / ${focusId}</span><button class="btn" id="unfocus">↙ 返回概览</button></div><div class="grid focus-main">${module(focusId,'full')}</div><div class="thumbs">${order.map(id=>`<button data-focus="${id}" class="${id===focusId?'active':''}">${{trend:'交易趋势',visits:'访问趋势',revenue:'总交易额',orders:'完成订单',channels:'活跃渠道'}[id]}<br><span class="sub">点击切换详情</span></button>`).join('')}</div>`:`<div class="grid">${order.map((id,i)=>module(id,i===0?'hero':i===1||i===2?'side':'half')).join('')}</div>`;
if(mode==='collapse')html=`<div class="collapse-area" id="metrics">${summary()}</div><div class="grid band" style="margin-top:24px">${chart('交易趋势','full')}${chart('访问趋势','full','visits',true)}</div>${table()}<div class="card" style="margin-top:48px;min-height:300px"><h3>持续阅读区</h3><p>滚动时核心指标留在顶部。反向滚动连续恢复大号指标。</p></div>`;if(mode==='drawer')html=table();
$('#main').innerHTML=html;$('#compact').innerHTML=`<span>交易额 <b data-value="428600">${fmt(428600*factor())}</b></span><span>订单 <b data-value="2841">${fmt(2841*factor())}</b></span>`;if(selected>=0&&$('#drawer'))openRow(selected);bind();collapse();}
function save(){try{localStorage.setItem('dashboard-demo-order',JSON.stringify(order))}catch(e){}}
function reorder(id,target){const a=order.indexOf(id),b=order.indexOf(target);if(a<0||b<0||a===b)return;const positions=new Map($$('.bento>.card').map(el=>[el.dataset.id,el.getBoundingClientRect()]));order.splice(a,1);order.splice(b,0,id);save();render();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)$$('.bento>.card').forEach(el=>{const old=positions.get(el.dataset.id),now=el.getBoundingClientRect();if(old)el.animate([{transform:`translate(${old.left-now.left}px,${old.top-now.top}px)`},{transform:'translate(0,0)'}],{duration:260,easing:'ease-out'})})}
function highlight(i){hover=i;$$('.bars').forEach(b=>{b.classList.toggle('hovering',i>=0);[...b.children].forEach((x,j)=>x.classList.toggle('hot',i===j))});$$('.ref').forEach(r=>{r.style.display=i<0?'none':'block';r.style.left=`${(i+.5)/12*100}%`});$$('.hover-label').forEach(x=>x.textContent=i<0?'悬停比较同一日期':`10.${String(i+1).padStart(2,'0')} · 交易 ${fmt(raw[i]*factor())} / 访问 ${fmt((100-raw[i]*.5)*factor())}`)}
function openRow(i){selected=i;$$('[data-row]').forEach(x=>x.classList.toggle('selected',+x.dataset.row===i));const d=$('#drawer');if(!d)return;const r=records[i];d.classList.add('open');d.innerHTML=`<section class="card"><div class="card-top"><span class="eyebrow">Record ${i+1} / 8</span><button class="iconbtn" id="close-drawer" aria-label="关闭详情">×</button></div><h2>${r[0]}</h2><span class="pill">${r[1]} / 模拟记录</span><div class="big">¥${fmt(r[2]*factor())}</div><div class="detail-line"><span>对照变化</span><b>${(r[3]*100).toFixed(0)}%</b></div><div class="detail-line"><span>所选期间</span><b>${$('#range').selectedOptions[0].text}</b></div><p>这里承载同一记录的详情。切换记录时保留列表和当前筛选。</p><button class="btn" id="prev-row" ${i===0?'disabled':''}>↑ 上一条</button> <button class="btn" id="next-row" ${i===7?'disabled':''}>↓ 下一条</button></section>`;$('#close-drawer').onclick=closeRow;$('#prev-row').onclick=()=>openRow(Math.max(0,i-1));$('#next-row').onclick=()=>openRow(Math.min(7,i+1))}
function closeRow(){selected=-1;$('#drawer')?.classList.remove('open');$$('[data-row]').forEach(x=>x.classList.remove('selected'))}
function bind(){ $$('[data-mode]').forEach(b=>b.onclick=()=>{cancelAnimationFrame(anim);mode=b.dataset.mode;focusId=null;selected=-1;render()});$$('[data-point]').forEach(b=>{b.onpointerenter=()=>highlight(+b.dataset.point);b.onfocus=()=>highlight(+b.dataset.point);b.onblur=()=>highlight(-1)});$$('.bars').forEach(b=>b.onpointerleave=()=>highlight(-1));$$('[data-focus]').forEach(b=>b.onclick=()=>{mode='focus';focusId=b.dataset.focus;render()});if($('#unfocus'))$('#unfocus').onclick=()=>{focusId=null;render()};$$('[data-row]').forEach(r=>{r.onclick=()=>openRow(+r.dataset.row);r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openRow(+r.dataset.row)}}});$$('.list').forEach(t=>t.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','Escape'].includes(e.key)){e.preventDefault();if(e.key==='Escape')closeRow();else openRow(Math.max(0,Math.min(7,(selected<0?0:selected)+(e.key==='ArrowDown'?1:-1))))}}));
$$('[data-drag]').forEach(b=>{b.ondragstart=e=>{dragId=b.dataset.drag;e.dataTransfer.setData('text/plain',dragId);b.closest('.card').classList.add('dragging')};b.ondragend=()=>{$$('.card').forEach(x=>x.classList.remove('dragging','drop-over'));dragId=null}});$$('.bento>.card').forEach(c=>{c.ondragover=e=>{if(dragId){e.preventDefault();c.classList.add('drop-over')}};c.ondragleave=()=>c.classList.remove('drop-over');c.ondrop=e=>{e.preventDefault();reorder(dragId,c.dataset.id);dragId=null}});$$('[data-move]').forEach(b=>b.onclick=()=>{const i=order.indexOf(b.dataset.move);if(i>0)reorder(b.dataset.move,order[i-1])});
$$('[data-task]').forEach(t=>t.ondragstart=e=>{e.dataTransfer.setData('text/plain',`task:${t.dataset.task}`)});$$('[data-state]').forEach(c=>{c.ondragover=e=>e.preventDefault();c.ondrop=e=>{e.preventDefault();const v=e.dataTransfer.getData('text/plain');if(v.startsWith('task:')){tasks[+v.slice(5)].state=+c.dataset.state;render()}}});$$('[data-task-state]').forEach(s=>s.onchange=()=>{tasks[+s.dataset.taskState].state=+s.value;render()});$$('[data-region]').forEach(g=>{const choose=()=>{const i=+g.dataset.region;$('#region-name').textContent=`区域 ${i+1}`;const v=$('.tl [data-value]');v.dataset.value=records[i][2];v.textContent=fmt(records[i][2]*factor());$$('[data-region] circle').forEach((c,j)=>{c.setAttribute('r',j===i?28:16);c.setAttribute('fill',j===i?'#286b50':'#88ad88')})};g.onclick=choose;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}}});$$('[data-time]').forEach(b=>b.onclick=()=>{const i=+b.dataset.time,j=i%5,start=i<5?j*6+3:55+j*3,end=start+(i<5?23:18);const tm=v=>{const mins=Math.round((8+v/10)*60);return `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`};$('#time-detail').textContent=`${b.textContent} · ${tm(start)}–${tm(end)} · 模拟事项`})}
function update(){cancelAnimationFrame(anim);const f=factor();$$('.bar').forEach(b=>{const i=+b.dataset.point,alt=b.closest('[data-id]').dataset.id==='visits';b.style.setProperty('--h',`${(alt?100-raw[i]*.5:raw[i])*f/1.2}%`)});const vals=$$('[data-value]').map(e=>({e,a:Number(e.textContent.replaceAll(',','')),b:Number(e.dataset.value)*f}));const start=performance.now(),duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:420;function tick(now){const p=duration?Math.min(1,(now-start)/duration):1;vals.forEach(v=>v.e.textContent=fmt(v.a+(v.b-v.a)*(1-(1-p)**3)));if(p<1)anim=requestAnimationFrame(tick)}anim=requestAnimationFrame(tick);$$('[data-row]').forEach((el,i)=>el.children[2].textContent='¥'+fmt(records[i][2]*f));if(selected>=0)openRow(selected);if(hover>=0)highlight(hover)}
function collapse(){const metric=$('#metrics');if(mode!=='collapse'||!metric){$('#toolbar').classList.remove('collapsed');return}const top=$('#toolbar').getBoundingClientRect().top;const p=Math.max(0,Math.min(1,(window.scrollY-160)/150));metric.style.maxHeight=`${160*(1-p)}px`;metric.style.opacity=1-p;metric.style.transform=`translateY(${-12*p}px)`;$('#toolbar').classList.toggle('collapsed',p>.85)}
$('#range').onchange=update;$('#category').onchange=update;$('#reset').onclick=()=>{order=['trend','revenue','orders','channels','visits'];save();tasks.forEach((t,i)=>t.state=i%5);focusId=null;selected=-1;$('#range').value='1';$('#category').value='1';render()};window.addEventListener('scroll',collapse,{passive:true});render();
</script>
</html>
