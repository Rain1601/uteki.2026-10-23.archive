<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <meta name="description" content="Uteki 蓝色水滴的动态光影实验。From information to insight.">
    <title>Uteki · 滴中见微</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="studio.css">
    <script src="studio.js" defer></script>
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="./" aria-label="Uteki">uteki<span class="brand-dot"></span></a>
      <span class="page-name" data-i18n="pageName">流动的品牌</span>
      <button class="language-button" id="language" type="button" aria-label="Switch to English">EN <span aria-hidden="true">↗</span></button>
    </header>

    <main class="studio">
      <section class="stage" id="stage" aria-label="Logo 动态展示" tabindex="0">
        <div class="stage-topline">
          <span class="edition" data-i18n="edition">Uteki 动态标识</span>
          <span class="live-state"><span id="state-dot" class="state-dot"></span><span id="state-label">流动中</span></span>
        </div>

        <canvas class="atmosphere" id="atmosphere" aria-hidden="true"></canvas>
        <div class="brand-lockup" id="brand-lockup">
          <div class="mark-area" id="mark-area" role="img" aria-label="Uteki 蓝色玻璃水滴">
            <div class="mark-motion" id="mark-motion">
              <div class="raster-crop mark-fallback" id="mark-fallback" aria-hidden="true">
                <img src="assets/uteki-glass.jpeg" alt="" draggable="false">
              </div>
              <canvas id="logo" class="logo-canvas" aria-hidden="true"></canvas>
            </div>
          </div>
          <div class="wordmark-group" id="wordmark-group">
            <div class="raster-crop wordmark" id="wordmark" role="img" aria-label="uteki">
              <img src="assets/uteki-glass.jpeg" alt="" draggable="false">
            </div>
            <p class="tagline">From information to insight</p>
          </div>
        </div>

        <div class="stage-bottomline">
          <p><span class="small-star" aria-hidden="true">✳</span><span data-i18n="stageHint">移动光标，让光随你流动</span></p>
          <button class="focus-button" id="focus" type="button" aria-pressed="false"><span class="focus-icon" aria-hidden="true"></span><span data-i18n="focus">纯净欣赏</span></button>
        </div>
      </section>

      <aside class="controls" aria-label="动效控制">
        <div class="intro">
          <p class="intro-note" data-i18n="introNote">一滴之间，万象浮现</p>
          <h1 data-i18n="heading">滴中，见微。</h1>
          <p class="intro-copy" data-i18n="introCopy">让信息流动，让洞察浮现。<br>给一滴蓝，一点呼吸的空间。</p>
        </div>

        <fieldset class="control-section effect-section">
          <legend data-i18n="motionLabel">动效</legend>
          <div class="effect-list">
            <button class="effect-option is-selected" type="button" data-effect="drift" aria-pressed="true">
              <span class="effect-art art-drift" aria-hidden="true"><i></i><i></i></span>
              <span class="effect-title"><span data-i18n="drift">流动</span><small>Flow</small></span>
              <span class="selection-dot" aria-hidden="true"></span>
            </button>
            <button class="effect-option" type="button" data-effect="ripple" aria-pressed="false">
              <span class="effect-art art-ripple" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="effect-title"><span data-i18n="ripple">涟漪</span><small>Ripple</small></span>
              <span class="selection-dot" aria-hidden="true"></span>
            </button>
            <button class="effect-option" type="button" data-effect="breathe" aria-pressed="false">
              <span class="effect-art art-breathe" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="effect-title"><span data-i18n="breathe">呼吸</span><small>Breathe</small></span>
              <span class="selection-dot" aria-hidden="true"></span>
            </button>
          </div>
          <p class="effect-description" id="effect-description">蓝色沿曲面流转，光在水滴里缓缓折射。</p>
        </fieldset>

        <fieldset class="control-section material-section">
          <legend data-i18n="materialLabel">质感</legend>
          <div class="material-switch">
            <button type="button" class="material-option is-selected" data-material="glass" aria-pressed="true"><span class="material-swatch glass-swatch" aria-hidden="true"></span><span data-i18n="glass">琉璃蓝</span></button>
            <button type="button" class="material-option" data-material="silk" aria-pressed="false"><span class="material-swatch silk-swatch" aria-hidden="true"></span><span data-i18n="silk">丝绸蓝</span></button>
          </div>
        </fieldset>

        <div class="control-section tempo-section">
          <div class="tempo-heading"><label for="speed" data-i18n="speedLabel">节奏</label><output for="speed" id="speed-output">1×</output></div>
          <input type="range" id="speed" min="0.5" max="1.5" step="0.25" value="1" aria-valuetext="1 倍速">
          <div class="tempo-caption"><span data-i18n="slower">舒缓</span><span data-i18n="faster">轻快</span></div>
        </div>

        <div class="playback">
          <button type="button" class="play-button" id="play" aria-pressed="false"><span class="play-icon is-playing" id="play-icon" aria-hidden="true"></span><span id="play-label">暂停动效</span></button>
          <button type="button" class="replay-button" id="replay" aria-label="重新播放" title="重新播放"><span aria-hidden="true">↺</span></button>
        </div>
        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      </aside>
    </main>

    <footer class="footer"><p data-i18n="footerLine">在流动中，发现清晰。</p><span>Uteki — Motion collection</span></footer>
    <noscript><p class="noscript-message">启用 JavaScript 以播放动效。Enable JavaScript to play the animation.</p></noscript>
  </body>
</html>
