schema: spec-driven
context: |
  Uteki 是 Python 投资研究项目；Node 仅用于开发规范工具。
  用中文写产物，保留 OpenSpec 结构标题及 SHALL/MUST。
  先读 AGENTS.md、TODO.md 和 docs/DATA_AGENT_FRAMEWORK_DESIGN.zh-CN.md。
  核心设计是唯一顶层设计，TODO 只记录当前一个动作；OpenSpec 仅承载明确启用的具体变更，不生成平行路线或恢复历史任务。
  文档齐全、任务勾选、提交、测试通过与研究验收必须分别报告。
  来源采纳、Gold、研究结论及真实泛化不能凭文件存在或模型共识判定。
rules:
  proposal:
    - 写明实际问题、输入、输出、边界及可观察的验收例子。
  specs:
    - 使用 Requirement 和 Scenario；未知、失败及未审核状态必须显式保留。
  tasks:
    - 每项完成声明关联具体代码或验证证据；不得把测试数量当产品验收。
operations:
  apply:
    guidance:
      - 遵循 AGENTS.md 的授权和来源范围；本地检查不自动调用付费模型。
  archive:
    guidance:
      - 区分工程完成与研究采纳；未验收事项写清楚，不自动提升业务状态。
